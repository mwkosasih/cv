<!-- Floating AI Twin Chat Widget -->

<!-- Floating Trigger Button -->
<button id="chatFloatingBtn" class="chat-floating-btn" aria-label="Open AI Twin Chat">
  <div class="chat-btn-avatar">
    <svg viewBox="0 0 24 24">
      <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.72V7h1a7 7 0 0 1 7 7v1h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-1H2a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h1v-1a7 7 0 0 1 7-7h1V5.72c-.6-.34-1-.98-1-1.72a2 2 0 0 1 2-2M7.5 13A1.5 1.5 0 0 0 6 14.5a1.5 1.5 0 0 0 1.5 1.5 1.5 1.5 0 0 0 1.5-1.5A1.5 1.5 0 0 0 7.5 13m9 0a1.5 1.5 0 0 0-1.5 1.5 1.5 1.5 0 0 0 1.5 1.5 1.5 1.5 0 0 0 1.5-1.5 1.5 1.5 0 0 0-1.5-1.5Z"/>
    </svg>
    <span class="status-dot"></span>
  </div>
  <span>Chat with AI Twin</span>
</button>

<!-- Floating Chat Modal Window -->
<div id="chatWindow" class="chat-window" role="dialog" aria-modal="true" aria-labelledby="chatHeaderTitle">
  <!-- Chat Header -->
  <div class="chat-header">
    <div class="chat-header-user">
      <div class="chat-header-avatar">🤖</div>
      <div class="chat-header-info">
        <h4 id="chatHeaderTitle">Wildan's AI Twin</h4>
        <span id="chatHeaderStatus"><span class="online-badge"></span> Active</span>
      </div>
    </div>
    <div class="chat-header-actions">
      <button id="chatMinimizeBtn" class="chat-header-btn" title="Minimize" aria-label="Minimize Chat">
        <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24">
          <path d="M19 13H5v-2h14v2z"/>
        </svg>
      </button>
      <button id="chatCloseBtn" class="chat-header-btn" title="Close" aria-label="Close Chat">
        <svg style="width:18px;height:18px;fill:currentColor;" viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Chat Body -->
  <div id="chatBody" class="chat-body">
    <!-- Intro Message -->
    <div class="chat-message bot">
      <div class="msg-bubble">
        <p>
          Hi there! 👋 I am <strong>Mohammad Wildan Kosasih's AI Twin</strong>.
        </p>
        <p>
          Ask me anything about my backend experience at <strong>Stockbit</strong>, <strong>Qasir.id</strong>, my <strong>Golang</strong> architectures, or how to get in touch!
        </p>
        <!-- Suggestions -->
        <div class="chat-suggestions">
          <button class="suggestion-chip" data-prompt="What were your key achievements at Stockbit?">
            📈 Stockbit experience &amp; IDX migration
          </button>
          <button class="suggestion-chip" data-prompt="What is your primary tech stack and backend expertise?">
            ⚙️ Primary tech stack &amp; Golang focus
          </button>
          <button class="suggestion-chip" data-prompt="How did you migrate from PHP monolith to Go microservices?">
            🔄 Monolith to Microservices migration
          </button>
          <button class="suggestion-chip" data-prompt="What are your favorite anime and games?">
            🎬 Anime, gaming &amp; life outside tech
          </button>
          <button class="suggestion-chip" data-prompt="How can I contact or hire you?">
            📬 Contact &amp; Availability
          </button>
        </div>
      </div>
      <span class="msg-time">Just now</span>
    </div>
  </div>

  <!-- Chat Footer / Input -->
  <div class="chat-footer">
    <form id="chatForm" class="chat-form">
      <input
        id="chatInput"
        type="text"
        class="chat-input"
        placeholder="Ask Wildan's AI Twin anything..."
        autocomplete="off"
        required
      />
      <button type="submit" class="chat-send-btn" aria-label="Send Message">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </form>
    <div id="chatStatusSubtext" class="chat-status-subtext">
      Loading AI status...
    </div>
  </div>
</div>
